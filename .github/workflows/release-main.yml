name: 🚀 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 📥 Install deps
        run: npm ci

      - name: 🟡 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🏷️ Create release (npm run next)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run next

      - name: 🧰 Build bun package
        run: npm run bun:package2

      - name: 📦 Upload .exe files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-executables
          path: |
            **/TravelAlbums*.exe
